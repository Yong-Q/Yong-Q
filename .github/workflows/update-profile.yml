name: Refresh research profile

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generator
        run: python -B -m unittest discover -s tests -v
      - name: Fetch public research projects and render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/update_profile.py
      - name: Publish changed content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/*.svg assets/initial.js data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public research profile'
            git push
          fi
